async function funsearch(a){
  ul.classList.remove('mostrar');

  const res = await fetchete([`SELECT * FROM ${t.SelectedTable} WHERE ${t.FileSelectedTable} LIKE '${a}%';`],url+'api/pass');
  setTimeout(()=>{
    while(ul.children.length>0){ul.removeChild(ul.firstChild);}
    for(let i in res){
      let iii = Object.keys(res[i]);const li = document.createElement('li');let iiii=0;
      for(let ii in res[i]){li.textContent += ` ${iii[iiii]} : ${res[i][ii]} || `;iiii+=1;}
      ul.appendChild(li);
    }
    ul.classList.remove('ocultar');ul.classList.add('mostrar'); 
  },500);
  }else{
  setTimeout(()=>{
    while(ul.children.length>0){ul.removeChild(ul.firstChild);}
    ul.classList.remove('ocultar');
    ul.classList.add('mostrar');
  },500);
  }
}

//prompt experimental
function newprompt(option,callback){
  /*
  option:
    fondo     const modal = document.createElement('div');modal.classList.add('modal');//fondo negro del modal
    background      const modalc = document.createElement('div');modalc.classList.add('modalc');//modal (login/register)
    titulo      const prompt_titulo = document.createElement('h1');//titulo modal
    texto     const prompt_parrafo = document.createElement('p');//texto modal
    inputs=[{type,text/placeholder}]      const prompt_input = document.createElement('input');//input modal
    footer
  callback:()=>{}     debe ser para el ultimo input
  */

  const modal = document.createElement('div');modal.classList.add('modal');

  
  const modalc = document.createElement('div');modalc.classList.add('modalc');
  modal.appendChild(modalc);

  const prompt_titulo = document.createElement('h1');
  prompt_titulo.classList.add('prompt_titulo');
  prompt_titulo.textContent = option.titulo;
  modalc.appendChild(prompt_titulo);

  if(option.texto){
    const prompt_parrafo = document.createElement('p');
    prompt_parrafo.classList.add('prompt_parrafo');
    prompt_parrafo.textContent = option.texto;
    modalc.appendChild(prompt_parrafo);
  }

  if(option.inputs){
    for(i of option.inputs){
      const prompt_input = document.createElement('input');
      prompt_input.type = i.type;console.log(i);
      
      if(i.type==='text'){
        prompt_input.placeholder = i.text;
      }

      if(i.type==='button'){
        prompt_input.value = i.text;
      }
      
      if(callback){
        if(i===option.inputs[option.inputs.length-1] && prompt_input.type==='button'){
          prompt_input.onclick=callback;
        }
      }
      
      modalc.appendChild(prompt_input);
    } 
  }

  if(option.footer){
    const prompt_footer = document.createElement('p');
    prompt_footer.classList.add('prompt_footer');
    prompt_footer.textContent = option.footer;
    modalc.appendChild(prompt_footer);
  }

  document.body.appendChild(modal);

  //el callback debe contener 'document.body.removeChild(modal);'
}

async function login(www){
  let v = '';let w = '';
  if(www){
  nsc.classList.remove('ocultar');
  nsc.classList.add('mostrar');
  await miprompt('text','Iniciar seción','Ingresa el nombre del Administrador','').then(value => {if(value){v = value}});

  nsc.classList.remove('mostrar');
  nsc.classList.add('ocultar');
  setTimeout(()=>{
  modal.removeChild(nsc);   
  },500);
  }
  const res = await fetchete([`SELECT id,nombre,rol,contraseña FROM usuarios;`],url+'api/pass');  
  if(www){  
    let ii=false;
    for(let i of res){
      if(v === i.nombre && w === i.contraseña){
      session(i.id);
      localStorage.setItem('session',i.id);ii=true;
      localStorage.setItem('rol',i.rol);
      setTimeout(()=>{modal.style.display = 'none';},1000);
      break;
      }
    }
    if(!ii){
      modal.style.display = "flex";prompt_input.style.display = 'none';prompt_boton.style.display = 'none';
      await miprompt('text','Inicio de Seción Fallido','Nombre o Contraseña Incorrectos','',true);
    }else{
      setTimeout(()=>{modal.classList.add('ocultar');},500);
    }
  }else{session(1);localStorage.setItem('session',1);}
}

function miprompt(tipo,titulo,parrafo,valor){
  modalc.classList.remove('ocultar');
  modalc.classList.add('mostrar');
  modal.style.display = "flex";modal.style.flexDirection = "row";
  prompt_input.type = tipo;
  prompt_input.value=valor;
  prompt_titulo.textContent = titulo;
  prompt_parrafo.textContent = parrafo;
  return new Promise((resolve,reject)=>{currentResolve = resolve;currentReject = reject;});
}

async function register(www){

  nsc.classList.remove('mostrar');
  nsc.classList.add('ocultar');
  setTimeout(()=>{
  modal.removeChild(nsc);   
  },500);
  }
  const res = await fetchete([`SELECT id,nombre,rol,contraseña FROM usuarios;`],url+'api/pass');  
  if(www){  
    let ii=false;
    for(let i of res){
      if(v === i.nombre){
      ii=true;
      break;
      }
    }
    if(ii){
      modal.style.display = "flex";prompt_input.style.display = 'none';prompt_boton.style.display = 'none';

        modal.classList.add('ocultar');
        await fetchete([`INSERT INTO usuarios (nombre,contraseña) VALUES ('${v}','${w}');`],url+'api/pass');

        session(res[0].id);
      localStorage.setItem('session',res[0].id);
      localStorage.setItem('rol',res[0].rol);
      },500);
    }
  }else{session(1);localStorage.setItem('session',1);}
}
async function actions(button,p,table){
  modal.classList.remove('ocultar');

  let prom = '';if(button.tipo === 'string')button.tipo = 'text';await miprompt(button.tipo,'Añadir Dato','Ingresa el nuevo dato',p.textContent).then(value => {if(value){prom = value}});//

}
